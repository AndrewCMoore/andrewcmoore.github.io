<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrew Moore</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4rem 1.5rem;
    min-height: 100vh;
    box-sizing: border-box;
  }
  h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 2rem; }
  .grid {
    display: grid;
    gap: 1rem;
    width: 100%;
    max-width: 720px;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  }
  .card {
    display: block;
    padding: 1.25rem;
    border: 1px solid #2a2d35;
    border-radius: 10px;
    background: #171a21;
    color: inherit;
    text-decoration: none;
    transition: border-color 0.15s ease;
  }
  .card:hover { border-color: #5b8cff; }
  .card h2 { margin: 0 0 0.35rem; font-size: 1.05rem; }
  .card p { margin: 0; font-size: 0.85rem; color: #9aa0ab; }
</style>
</head>
<body>
  <h1>Andrew Moore — Projects</h1>
  <div class="grid">
    <a class="card" href="https://github.com/AndrewCMoore/equilibrium-planner">
      <h2>Equilibrium Planner</h2>
      <p>github.com/AndrewCMoore/equilibrium-planner</p>
    </a>
    <a class="card" href="./docs/">
      <h2>Docs</h2>
      <p>Project documentation</p>
    </a>
  </div>
</body>
</html>
